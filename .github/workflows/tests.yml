name: Проверка курсового проекта №10–15

on:
  push:
    branches: [main, hosting-laravel13]
  workflow_dispatch:

jobs:
  tests:
    name: Laravel + Vue/Vite + Pusher
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, pdo_sqlite, sqlite3, fileinfo, curl
          tools: composer:v2
          coverage: none
      - name: Install PHP dependencies (including Pusher SDK)
        run: composer install --no-interaction --prefer-dist --no-progress
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Vue, Echo, Pusher JS and Vite
        run: npm install --no-audit --no-fund
      - name: Compile production assets
        run: |
          npm run build
          test -s public/build/manifest.json
      - name: Create test environment
        run: cp .env.example .env
      - name: Run Laravel tests (including queue and events)
        env:
          BROADCAST_CONNECTION: log
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
          MAIL_MAILER: array
        run: php artisan test --display-warnings
      - name: Check routes
        env:
          APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
        run: php artisan route:list
      - name: Validate REST API routes and Postman collection
        env:
          APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
        run: |
          python3 -m json.tool docs/postman/LR15_REST_API.postman_collection.json > /dev/null
          php artisan route:list --path=api --json > /tmp/lr15-routes.json
          php -r '$routes=json_decode(file_get_contents("/tmp/lr15-routes.json"),true); $uris=array_column($routes,"uri"); foreach(["api/register","api/login","api/articles","api/articles/{article}","api/logout"] as $p) { if (!in_array($p,$uris,true)) { fwrite(STDERR,"Missing route: ".$p.PHP_EOL); exit(1); } } echo "REST API routes: ".count($routes).PHP_EOL;'

  local-ready-zip:
    name: Архив преподавателю — SQLite, vendor и Vue
    if: github.ref == 'refs/heads/main'
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, pdo_sqlite, sqlite3, fileinfo, curl
          tools: composer:v2
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build JS/CSS
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Test automated local setup
        run: |
          php scripts/setup-local.php
          test -f database/database.sqlite
          test -s LOCAL_LOGIN.txt
      - name: Smoke test real scheduler and generated daily email
        run: |
          php artisan schedule:list
          php artisan schedule:run
          php -r '$db = new PDO("sqlite:database/database.sqlite"); $count = (int) $db->query("SELECT COUNT(*) FROM daily_report_deliveries")->fetchColumn(); if ($count < 1) { fwrite(STDERR, "Schedule did not send and record daily email.\\n"); exit(1); }'
          test -s storage/logs/laravel.log
      - name: End-to-end HTTP smoke test (Postman-equivalent)
        run: |
          php artisan serve --host=127.0.0.1 --port=8015 > /tmp/lr15-serve.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          READY=0
          for i in $(seq 1 25); do
            if curl --silent --fail http://127.0.0.1:8015/api/articles > /tmp/lr15-articles.json; then READY=1; break; fi
            sleep 1
          done
          test "$READY" = "1"
          php -r '$json=json_decode(file_get_contents("/tmp/lr15-articles.json"),true); if (!is_array($json) || !isset($json["data"],$json["meta"])) exit(1); echo "GET /api/articles OK".PHP_EOL;'
          STATUS=$(curl --silent --output /tmp/lr15-unauthorized.json --write-out '%{http_code}' --header 'Accept: application/json' http://127.0.0.1:8015/api/user)
          test "$STATUS" = "401"
          php -r '$json=json_decode(file_get_contents("/tmp/lr15-unauthorized.json"),true); if (!is_array($json) || !isset($json["message"])) exit(1); echo "GET /api/user -> 401 JSON OK".PHP_EOL;'
          STATUS=$(curl --silent --output /tmp/lr15-validate.json --write-out '%{http_code}' --header 'Accept: application/json' --header 'Content-Type: application/json' --data '{"email":"invalid","password":"short"}' http://127.0.0.1:8015/api/register)
          test "$STATUS" = "422"
          php -r '$json=json_decode(file_get_contents("/tmp/lr15-validate.json"),true); if (!is_array($json) || !isset($json["errors"])) exit(1); echo "POST /api/register -> 422 JSON OK".PHP_EOL;'
      - name: Package working Laravel site
        run: |
          mkdir -p /tmp/delivery/Servernaya_10-15_Local
          rsync -a ./ /tmp/delivery/Servernaya_10-15_Local/ \
            --exclude='.git/' --exclude='.github/' --exclude='.env' \
            --exclude='LOCAL_LOGIN.txt' --exclude='database/*.sqlite' \
            --exclude='storage/logs/*.log' --exclude='node_modules/' \
            --exclude='.phpunit.result.cache' --exclude='bootstrap/cache/*.php'
          cd /tmp/delivery
          zip -qr "$GITHUB_WORKSPACE/Servernaya_10-15_SQLite_ready.zip" Servernaya_10-15_Local
          test -s "$GITHUB_WORKSPACE/Servernaya_10-15_SQLite_ready.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: Kursovaya_10-15_Local_SQLite
          path: Servernaya_10-15_SQLite_ready.zip
          retention-days: 30

  infinityfree-ready-zip:
    name: Архив InfinityFree — MySQL, vendor и собранный JS
    if: github.ref == 'refs/heads/hosting-laravel13'
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, pdo_sqlite, sqlite3, fileinfo, curl
          tools: composer:v2
          coverage: none
      - name: Install production PHP dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist --no-progress
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build production JS/CSS
        run: |
          npm install --no-audit --no-fund
          npm run build
          test -s public/build/manifest.json
      - name: Package hosting deployment without secrets
        run: |
          mkdir -p /tmp/delivery/Servernaya_10-15_InfinityFree
          rsync -a ./ /tmp/delivery/Servernaya_10-15_InfinityFree/ \
            --exclude='.git/' --exclude='.github/' --exclude='.env' \
            --exclude='node_modules/' --exclude='database/*.sqlite' \
            --exclude='LOCAL_LOGIN.txt' --exclude='storage/logs/*.log' \
            --exclude='tests/' --exclude='.phpunit.result.cache' \
            --exclude='bootstrap/cache/*.php'
          cd /tmp/delivery
          zip -qr "$GITHUB_WORKSPACE/Servernaya_10-15_InfinityFree_ready.zip" Servernaya_10-15_InfinityFree
          test -s "$GITHUB_WORKSPACE/Servernaya_10-15_InfinityFree_ready.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: Kursovaya_10-15_InfinityFree_MySQL
          path: Servernaya_10-15_InfinityFree_ready.zip
          retention-days: 30
